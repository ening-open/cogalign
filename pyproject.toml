[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cogalign"
version = "0.1.0"
description = "Behavior-derived cognitive alignment for multimodal language models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy", "pillow", "scipy", "tqdm"]

[project.optional-dependencies]
train = ["accelerate", "deepspeed", "peft", "torch", "transformers>=4.57.0", "trl"]
inference = ["qwen-vl-utils>=0.0.14", "torch", "transformers>=4.57.0"]
vllm = ["qwen-vl-utils>=0.0.14", "torch", "transformers>=4.57.0", "vllm"]
neural = ["h5py", "qwen-vl-utils>=0.0.14", "torch", "torchmetrics", "transformers>=4.57.0"]
visualization = ["pycortex"]
judge = ["openai"]
rationale = ["sentence-transformers"]
tracking = ["swanlab"]
quantization = ["bitsandbytes"]

[project.urls]
Repository = "https://github.com/ening-open/cogalign"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false
